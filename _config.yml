title: Jay Choo
description: "Software engineer — portfolio and resume"
url: "https://jaychoo.github.io"

remote_theme: "mmistakes/minimal-mistakes"
# Skin is handled by our own light/dark stylesheets (assets/css/main.scss,
# assets/css/dark.scss) + the nav toggle, not this static setting.

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap

markdown: kramdown

author:
  name: "Jay Choo"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jaychoo"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jaychoo"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
