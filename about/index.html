<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About — Jay Choo</title>
  <meta name="description" content="Software engineer — portfolio and resume">

  <!-- Apply saved/system theme before first paint to avoid a flash -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-white text-neutral-900 dark:bg-neutral-900 dark:text-neutral-50 antialiased">

  <header class="border-b border-neutral-200 dark:border-neutral-800">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-5">
      <a href="/" class="text-lg font-bold">Jay Choo</a>
      <nav class="flex items-center gap-6" aria-label="Primary">
        <a href="/about/" class="text-sm font-semibold">About</a>
        <a href="/projects/" class="text-sm hover:opacity-70">Projects</a>
        <button id="theme-toggle" type="button" aria-label="Toggle day/night mode"
                class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-neutral-300 dark:border-neutral-700 hover:opacity-70 transition">
          <!-- moon (shown in light mode) -->
          <svg class="block dark:hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- sun (shown in dark mode) -->
          <svg class="hidden dark:block h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-6 py-16">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">About</h1>

    <section class="mt-10">
      <h2 class="text-xl font-bold">Background</h2>
    </section>

    <section class="mt-10">
      <h2 class="text-xl font-bold">Skills</h2>
    </section>
  </main>

  <footer class="mx-auto max-w-4xl px-6 py-10 text-sm text-neutral-500 dark:text-neutral-400">
    <a href="https://github.com/jaychoo" class="hover:opacity-70">GitHub</a>
    <span class="mx-2">·</span>
    <span>jaychoo@gmail.com</span>
  </footer>

  <script src="/assets/js/theme.js"></script>
</body>
</html>
